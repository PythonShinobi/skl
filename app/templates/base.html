
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SKL Plaza{% endblock %}</title>

    <meta
        name="description"
        content="Discover rooms, fitness facilities, wellness amenities and convenient living at SKL Plaza, Karen, Gataka Road."
    >

    <link
        rel="icon"
        type="image/x-icon"
        href="{{ url_for('static', filename='images/hostel.png') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    {% block content %}{% endblock %}

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
        defer
    ></script>
</body>
</html>
